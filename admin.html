<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玄机子 · 后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--paper:#f7f3ed;--paper2:#ece6d9;--ink:#1a1a18;--ink2:#3a3936;--muted:#6b6a67;--line:#d9d0bf;--line2:#c9bda8;--ver:#c73e1d;--brass:#b89b5c;--accent:#1a2a4a}
    html,body{height:100%}
    body{font-family:"Noto Serif SC",serif;background:var(--paper);color:var(--ink)}
    i[data-lucide]{width:18px;height:18px}
    .paper-bg{position:fixed;inset:0;z-index:-1;background: radial-gradient(900px 500px at 20% -10%, rgba(184,155,92,.10), transparent 60%), linear-gradient(180deg, var(--paper), var(--paper2))}
    /* login */
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(26,26,24,.08)}
    .login-card h1{display:flex;gap:10px;align-items:center;justify-content:center;font-size:18px;letter-spacing:.12em}
    .seal{width:36px;height:36px;border-radius:8px;background:var(--ver);color:#fff;display:grid;place-items:center;font-weight:700}
    .login-card input{width:100%;margin-top:16px;padding:12px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font:inherit}
    .login-card input:focus{outline:none;border-color:var(--brass);background:#fff}
    .btn{width:100%;margin-top:12px;padding:12px;border:none;background:var(--ver);color:#fff;border-radius:12px;cursor:pointer}
    .btn:active{transform:scale(.98)}
    .err{color:var(--ver);font-size:13px;text-align:center;margin-top:10px;display:none}
    /* admin */
    .admin{max-width:1160px;margin:0 auto;padding:18px;display:none}
    .admin-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(26,26,24,.06)}
    .admin-head h1{display:flex;gap:8px;align-items:center;font-size:16px;letter-spacing:.08em}
    .stats{display:flex;gap:10px;flex-wrap:wrap}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:88px}
    .stat .n{font-weight:700;color:var(--accent)}
    .stat .l{font-size:11px;color:var(--muted)}
    .logout{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
    .records{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 30px rgba(26,26,24,.06)}
    .records-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
    .records-head h2{display:flex;gap:8px;align-items:center;font-size:14px}
    .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .date{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:inherit}
    .ghost{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
    .ghost.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .ip-group{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
    .ip-head{padding:10px 12px;background:var(--paper);display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer}
    .ip-head .ip{font-family:"JetBrains Mono",monospace;font-size:12px;background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:8px}
    .ip-head .loc{font-size:12px;color:var(--accent)}
    .ip-head .cnt{font-size:12px;color:var(--muted)}
    .ip-body{padding:12px;display:flex;flex-direction:column;gap:10px}
    .ip-group.collapsed .ip-body{display:none}
    .record{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
    .record-meta{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
    .tag{font-size:11px;background:#fff;border:1px solid var(--line);padding:3px 8px;border-radius:999px}
    .time{font-size:11px;color:var(--muted)}
    .bubble{padding:10px 12px;border-radius:12px;max-width:88%;font-size:13px;line-height:1.7}
    .bubble.user{background:var(--accent);color:#fff;align-self:flex-end}
    .bubble.assistant{background:#fff;border:1px solid var(--line);align-self:flex-start}
    .bubble .role{font-size:11px;opacity:.7;margin-bottom:4px}
    .conv{display:flex;flex-direction:column;gap:8px}
    .collapsed-txt{max-height:100px;overflow:hidden;position:relative}
    .collapsed-txt::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent, var(--paper))}
    .expand{margin-top:6px;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-size:12px}
    .section-title{font-weight:700;border-left:3px solid var(--ver);padding-left:8px;margin:8px 0 6px}
    .loading{display:grid;place-items:center;padding:30px;color:var(--muted)}
    .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ver);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){.records{padding:10px}.ip-head{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="paper-bg" aria-hidden="true"></div>

  <div class="login-wrap" id="loginContainer">
    <div class="login-card">
      <h1><span class="seal">观</span> 玄机子 · 后台</h1>
      <input id="passwordInput" type="password" placeholder="管理密码" autocomplete="off" />
      <button class="btn" id="loginBtn">进入</button>
      <p class="err" id="errorMsg">密码错误或未授权</p>
      <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px">密码由 Cloudflare 环境变量校验，不在前端硬编码比对</p>
    </div>
  </div>

  <div class="admin" id="adminContainer">
    <div class="admin-head">
      <h1><i data-lucide="scroll"></i> 玄机子 · 对话管理</h1>
      <div class="stats">
        <div class="stat"><div class="n" id="totalRecords">0</div><div class="l">总数</div></div>
        <div class="stat"><div class="n" id="todayRecords">0</div><div class="l">今日</div></div>
        <div class="stat"><div class="n" id="uniqueIPs">0</div><div class="l">独立IP</div></div>
      </div>
      <button class="logout" id="logoutBtn"><i data-lucide="log-out"></i> 退出</button>
    </div>

    <div class="records">
      <div class="records-head">
        <h2><i data-lucide="messages-square"></i> 对话记录 <span id="loadModeLabel" style="font-size:12px;color:var(--muted);font-weight:400"></span></h2>
        <div class="ctrls">
          <input type="date" id="dateSelector" class="date" />
          <button class="ghost" id="todayBtn"><i data-lucide="calendar-days"></i> 今日</button>
          <button class="ghost primary" id="allBtn"><i data-lucide="library"></i> 全部</button>
        </div>
      </div>
      <div id="recordsList"><div class="loading"><div class="spinner"></div><p>加载中</p></div></div>
    </div>
  </div>

<script>
let adminPassword = '';
let isLoggedIn=false;

function refreshIcons(){ if(window.lucide) window.lucide.createIcons(); }

async function login(){
  const input=document.getElementById('passwordInput');
  const pwd=input.value.trim();
  if(!pwd){ showErr('请输入密码'); return; }
  // 直接以后端校验为准：发一次轻量请求
  const test = await fetch('/api/admin/records?date='+new Date().toISOString().slice(0,10), { headers:{ 'X-Admin-Password': pwd } });
  if(test.status===401){
    showErr('密码错误或未授权'); return;
  }
  if(!test.ok){
    showErr('校验失败：'+test.status); return;
  }
  adminPassword = pwd;
  isLoggedIn=true;
  sessionStorage.setItem('adminPwd', pwd);
  document.getElementById('loginContainer').style.display='none';
  document.getElementById('adminContainer').style.display='block';
  initDateSelector(); initialLoad();
}
function showErr(msg){
  const e=document.getElementById('errorMsg'); e.textContent=msg; e.style.display='block'; setTimeout(()=>e.style.display='none',2500);
}
function logout(){
  isLoggedIn=false; adminPassword='';
  sessionStorage.removeItem('adminPwd');
  document.getElementById('loginContainer').style.display='grid';
  document.getElementById('adminContainer').style.display='none';
  document.getElementById('passwordInput').value='';
}
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('passwordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
document.getElementById('todayBtn').addEventListener('click', loadTodayRecords);
document.getElementById('allBtn').addEventListener('click', loadAllRecords);

// 恢复会话
const savedPwd = sessionStorage.getItem('adminPwd');
if(savedPwd){
  document.getElementById('passwordInput').value = savedPwd;
  // 自动尝试登录
  login();
}

function initDateSelector(){
  const el=document.getElementById('dateSelector');
  const today=new Date().toISOString().slice(0,10);
  el.value=today;
  el.addEventListener('change', loadRecordsByDate);
}
function loadTodayRecords(){
  const t=new Date().toISOString().slice(0,10);
  document.getElementById('dateSelector').value=t;
  loadRecords(t);
}
function loadAllRecords(){
  document.getElementById('dateSelector').value='';
  loadRecords(null,true);
}
function loadRecordsByDate(){
  const d=document.getElementById('dateSelector').value;
  if(d) loadRecords(d);
}
async function initialLoad(){
  const t=new Date().toISOString().slice(0,10);
  document.getElementById('dateSelector').value=t;
  await loadRecords(t);
}
async function loadRecords(date=null, loadAll=false){
  if(!isLoggedIn) return;
  const list=document.getElementById('recordsList');
  const label=document.getElementById('loadModeLabel');
  label.textContent = loadAll? '(全部)' : `(${date||new Date().toISOString().slice(0,10)})`;
  list.innerHTML='<div class="loading"><div class="spinner"></div><p>'+(loadAll?'加载全部中…':'加载 '+date+' 中…')+'</p></div>';
  try{
    let url='/api/admin/records';
    if(loadAll) url+='?all=true';
    else if(date) url+=`?date=${date}`;
    const resp = await fetch(url, { headers:{ 'X-Admin-Password': adminPassword } });
    if(!resp.ok) throw new Error('加载失败 '+resp.status);
    const data = await resp.json();
    displayRecords(data, loadAll, date);
  }catch(e){
    list.innerHTML='<div class="loading"><p>加载失败：'+escapeHtml(e.message)+'</p></div>';
  }
}

function displayRecords(data, loadAll, date){
  const list=document.getElementById('recordsList');
  const records=data.records||[];
  document.getElementById('totalRecords').textContent=data.stats?.total||records.length;
  document.getElementById('todayRecords').textContent=data.stats?.today||0;
  document.getElementById('uniqueIPs').textContent=data.stats?.uniqueIPs||0;
  if(data.dateRange){
    const sel=document.getElementById('dateSelector');
    if(data.dateRange.min) sel.min=data.dateRange.min;
    if(data.dateRange.max) sel.max=data.dateRange.max;
  }
  if(!records.length){
    const msg = loadAll? '暂无记录' : `${date||'今日'}暂无记录`;
    list.innerHTML='<div class="loading"><p>'+msg+'</p></div>'; return;
  }
  const groups={};
  records.forEach(r=>{ const ip=r.ip||'未知IP'; (groups[ip]=groups[ip]||[]).push(r); });
  Object.values(groups).forEach(arr=> arr.sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp)) );
  const sortedIPs = Object.keys(groups).sort((a,b)=> new Date(groups[b][0].timestamp)-new Date(groups[a][0].timestamp));
  let html=''; let gIdx=0; let global=0;
  sortedIPs.forEach(ip=>{
    const arr=groups[ip];
    const latest=new Date(arr[0].timestamp).toLocaleString('zh-CN');
    const loc=arr[0].location||'';
    html+=`<div class="ip-group" id="group-${gIdx}"><div class="ip-head" onclick="toggleGroup(${gIdx})"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="ip">${escapeHtml(ip)}</span><span class="loc">${escapeHtml(loc||'查询中')}</span><span class="cnt">${arr.length}条 · ${latest}</span></div><span style="font-size:12px;color:var(--muted)"><i data-lucide="chevron-down"></i></span></div><div class="ip-body">`;
    arr.forEach(rec=>{
      const time=new Date(rec.timestamp).toLocaleString('zh-CN');
      const q=escapeHtml(rec.question||'');
      const a=formatContent(rec.answer||'');
      const isLong=(rec.answer||'').length>220;
      html+=`<div class="record"><div class="record-meta"><span class="tag">${escapeHtml(rec.routeLabel||rec.model||rec.route||'文本')}</span><span class="time">${time}</span></div><div class="conv"><div class="bubble user"><div class="role">用户</div><div>${q}</div></div><div class="bubble assistant"><div class="role">玄机子</div><div class="${isLong?'collapsed-txt':''}" id="answer-${global}">${a}</div>${isLong?`<button class="expand" onclick="toggleExpand(${global})">展开全文</button>`:''}</div></div></div>`;
      global++;
    });
    html+='</div></div>'; gIdx++;
  });
  list.innerHTML=html; refreshIcons();
}
function toggleGroup(i){
  const el=document.getElementById('group-'+i);
  if(el) el.classList.toggle('collapsed');
}
function toggleExpand(i){
  const el=document.getElementById('answer-'+i);
  const btn=el.nextElementSibling;
  if(el.classList.contains('collapsed-txt')){ el.classList.remove('collapsed-txt'); btn.textContent='收起'; }
  else { el.classList.add('collapsed-txt'); btn.textContent='展开全文'; }
}
function formatContent(content){
  if(!content) return '';
  let s=escapeHtml(content);
  s=s.replace(/^###\s*(.+)$/gm,'<div class="section-title">$1</div>').replace(/^##\s*(.+)$/gm,'<div class="section-title">$1</div>').replace(/^#\s*(.+)$/gm,'<div class="section-title">$1</div>');
  s=s.replace(/\n/g,'<br>');
  s=s.replace(/【([^】]+)】/g,'<div class="section-title">$1</div>');
  s=s.replace(/「([^」]+)」/g,'<mark>$1</mark>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return s;
}
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

refreshIcons();
</script>
</body>
</html>
