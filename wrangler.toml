# Cloudflare Pages · Diviner
name = "diviner"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# 密钥只放 Dashboard Variables and Secrets，不要写入本文件。
# 需要：B_AI_API_KEY、GROQ_API_KEY、ZHIPU_API_KEY、ADMIN_PASSWORD；可选：BRAVE_API_KEY。

# KV 命名空间绑定：CHAT_LOGS 保存问卜档案，后台读取。
# 本项目已绑定下方 namespace。若部署到其他 Cloudflare 账号：
#   wrangler kv namespace create CHAT_LOGS
# 再把返回的 id 替换下方的值。
[[kv_namespaces]]
binding = "CHAT_LOGS"
id = "6033ad3d4bfa43c3bc679bcbe6e74643"

# Workers AI binding 保留备用；当前推演线路全部走第三方上游单线路直连，
# 不以 Workers AI 作兜底。
[ai]
binding = "AI"
